# pnpm settings for this single-package repository.

# Dependency install scripts are denied unless explicitly reviewed here.
# Both ship prebuilt platform binaries through optionalDependencies, so their
# postinstall fallbacks are not needed:
# - esbuild: used by Orval to load its config
# - unrs-resolver: used by eslint-import-resolver-typescript (eslint-config-expo)
allowBuilds:
  esbuild: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - "@expo/cli@57.0.28 || 57.0.29 || 57.0.30 || 57.0.31 || 57.0.32 || 57.0.33"
  - "@expo/config-plugins@57.0.10 || 57.0.11 || 57.0.12"
  - "@expo/config@57.0.10 || 57.0.11"
  - "@expo/image-utils@0.11.6 || 0.11.7"
  - "@expo/metro-config@57.0.13 || 57.0.14"
  - "@expo/metro-file-map@57.0.4"
  - "@expo/prebuild-config@57.0.17 || 57.0.18 || 57.0.19 || 57.0.20"
  - "@expo/require-utils@57.0.6 || 57.0.7"
  - "@expo/router-server@57.0.12 || 57.0.13 || 57.0.14 || 57.0.15"
  - babel-preset-expo@57.0.14 || 57.0.15 || 57.0.16 || 57.0.17
  - expo-asset@57.0.19 || 57.0.20 || 57.0.21
  - expo-constants@57.0.21 || 57.0.22 || 57.0.23
