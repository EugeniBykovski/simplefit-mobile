name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Git hooks are a local developer aid; CI runs the checks explicitly.
  HUSKY: "0"
  EXPO_NO_TELEMETRY: "1"
  # Public, non-secret placeholder so the JS bundle can be exported.
  EXPO_PUBLIC_API_URL: https://api.simplefit.invalid

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the PR base and head commits exist locally and
          # commitlint can validate every commit in base..head. (A conditional
          # `cond && 0 || 1` always yields 1: 0 is falsy in Actions expressions.)
          fetch-depth: 0

      - name: Set up pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@v6

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Commit messages follow the SF convention
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck (with generated typed routes)
        run: pnpm typecheck

      - name: Test
        run: pnpm test --ci

      - name: Generated API client is up to date
        # The backend repository is not checked out here, so this verifies the
        # committed client against the committed OpenAPI snapshot.
        run: pnpm api:check

      - name: Expo SDK dependency compatibility
        run: pnpm expo:check

      - name: Expo config resolves
        run: pnpm config:check

      - name: Expo Doctor
        run: pnpm expo:doctor

      - name: JavaScript bundles for iOS and Android (Metro export)
        # Proves the app bundles headlessly. It is NOT a native build: iOS and
        # Android binaries are built by EAS Build (not run on every commit).
        run: pnpm bundle:check
